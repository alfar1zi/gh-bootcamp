<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Peta kurikulum CodeCraft Academy dalam empat tahap">
  <title>Peta kurikulum CodeCraft Academy</title>
  <rect width="880" height="300" fill="#0f1011"/>
  <rect x="0.5" y="0.5" width="879" height="299" fill="none" stroke="#ffffff1f"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8">
    <text x="40" y="46" fill="#62666d">KURIKULUM</text>
    <text x="40" y="76" fill="#f7f8f8" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.4">Empat tahap, satu portofolio</text>
  </g>

  <line x1="40" y1="112" x2="840" y2="112" stroke="#ffffff14"/>
  <line x1="40" y1="112" x2="700" y2="112" stroke="#5e6ad2" stroke-width="2"/>

  <g>
    <circle cx="40" cy="112" r="7" fill="#828fff"/>
    <circle cx="293" cy="112" r="7" fill="#828fff"/>
    <circle cx="546" cy="112" r="7" fill="#828fff"/>
    <circle cx="700" cy="112" r="5" fill="#0f1011" stroke="#ffffff26" stroke-width="2"/>
    <circle cx="840" cy="112" r="5" fill="#0f1011" stroke="#ffffff26" stroke-width="2"/>
  </g>

  <g font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
    <g transform="translate(40,142)">
      <text y="0" fill="#f7f8f8" font-size="14" font-weight="500">HTML &amp; CSS</text>
      <text y="22" fill="#8a8f98" font-size="12.5">Mulai dari nol</text>
      <text y="42" fill="#62666d" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Minggu 1-3</text>
    </g>
    <g transform="translate(293,142)">
      <text y="0" fill="#f7f8f8" font-size="14" font-weight="500">JavaScript</text>
      <text y="22" fill="#8a8f98" font-size="12.5">Logika &amp; DOM</text>
      <text y="42" fill="#62666d" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Minggu 4-8</text>
    </g>
    <g transform="translate(546,142)">
      <text y="0" fill="#f7f8f8" font-size="14" font-weight="500">Python</text>
      <text y="22" fill="#8a8f98" font-size="12.5">Otomasi &amp; data</text>
      <text y="42" fill="#62666d" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Minggu 9-11</text>
    </g>
    <g transform="translate(700,142)">
      <text y="0" fill="#8a8f98" font-size="14" font-weight="500">UI/UX</text>
      <text y="22" fill="#62666d" font-size="12.5">Desain antarmuka</text>
      <text y="42" fill="#62666d" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Minggu 12</text>
    </g>
    <g transform="translate(840,142)">
      <text y="0" fill="#8a8f98" font-size="14" font-weight="500">Portofolio</text>
      <text y="22" fill="#62666d" font-size="12.5">Karya rilisan</text>
      <text y="42" fill="#62666d" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Minggu 13-16</text>
    </g>
  </g>

  <line x1="40" y1="228" x2="840" y2="228" stroke="#ffffff14"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <rect x="40" y="248" width="7" height="7" rx="2" fill="#828fff"/>
    <text x="55" y="255" fill="#8a8f98">Selesai</text>
    <rect x="130" y="248" width="7" height="7" rx="2" fill="#0f1011" stroke="#ffffff26"/>
    <text x="145" y="255" fill="#8a8f98">Terencana</text>
    <text x="840" y="255" fill="#62666d" text-anchor="end">16 minggu</text>
  </g>
</svg>
